name: Unimate CI/CD (ECR:test -> EC2)

on:
  push:
    branches: ["main"]

env:
  AWS_REGION: ap-northeast-2
  ASG_NAME: unimate-asg
  ECR_REPOSITORY: test
  CONTAINER_NAME: unimate-app
  HEALTH_URL: http://localhost:8080/actuator/health

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (ECR push)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push (two tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:unimate-${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:unimate-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials (for deploy)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover running EC2 public IPs from ASG
        id: discover_hosts
        shell: bash
        run: |
          set -euo pipefail
          HOSTS=$(aws ec2 describe-instances \
            --filters "Name=tag:aws:autoscaling:groupName,Values=${{ env.ASG_NAME }}" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text | tr '\t' ',' | sed 's/^,*//;s/,*$//')

          if [ -z "$HOSTS" ] || [ "$HOSTS" = "None" ]; then
            echo "No running EC2 public IPs found for ASG=${{ env.ASG_NAME }}"
            exit 1
          fi

          echo "Resolved deploy hosts: $HOSTS"
          echo "hosts=$HOSTS" >> "$GITHUB_OUTPUT"

      - name: Deploy (docker pull & run)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.discover_hosts.outputs.hosts }}
          sync: false
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          debug: true
          envs: AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            set -e
            echo "=== deploy start: $(date) ==="

            AWS_REGION="${{ env.AWS_REGION }}"
            ECR_REGISTRY="${{ secrets.ECR_REGISTRY }}"
            ECR_REPO="${{ env.ECR_REPOSITORY }}"
            IMAGE="${ECR_REGISTRY}/${ECR_REPO}:unimate-latest"

            echo "IMAGE=${IMAGE}"
            echo "HOST=$(hostname)"
            docker --version
            aws --version
            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            echo "=== docker pull start ==="
            docker pull "${IMAGE}"
            echo "=== docker pull done ==="

            # ✅ 8080 포트 점유 정리
            echo "=== check who uses 8080 ==="
            sudo -n ss -ltnp | grep ':8080' || ss -ltn | grep ':8080' || true

            echo "=== stop containers publishing 8080 ==="
            docker ps --filter "publish=8080" -q | xargs -r docker rm -f

            echo "=== check again ==="
            sudo -n ss -ltnp | grep ':8080' || ss -ltn | grep ':8080' || true

            docker rm -f "${{ env.CONTAINER_NAME }}" || true

            # FCM 서비스 계정 키 파일 준비
            install -m 600 /dev/null /home/ubuntu/firebase-key.json
            cat > /home/ubuntu/firebase-key.json <<'EOF'
            ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
            EOF

            docker run -d --name "${{ env.CONTAINER_NAME }}" \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /home/ubuntu/firebase-key.json:/app/firebase-key.json:ro \
              -e TZ=Asia/Seoul \
              -e SPRING_PROFILES_ACTIVE='${{ secrets.SPRING_PROFILES_ACTIVE }}' \
              -e SPRING_DATASOURCE_URL="jdbc:mysql://${{ secrets.DB_HOST }}:${{ secrets.DB_PORT }}/${{ secrets.DB_NAME }}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false" \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e JWT_SECRET='${{ secrets.JWT_SECRET }}' \
              -e GOOGLE_CLIENT_ID='1053469759409-obd1i0257vt7qi2djjd1bfcrcp142ljo.apps.googleusercontent.com' \
              -e MAIL_HOST='${{ secrets.MAIL_HOST }}' \
              -e MAIL_PORT='${{ secrets.MAIL_PORT }}' \
              -e MAIL_USERNAME='${{ secrets.MAIL_USERNAME }}' \
              -e MAIL_PASSWORD='${{ secrets.MAIL_PASSWORD }}' \
              -e S3_BUCKET_NAME='${{ secrets.S3_BUCKET_NAME }}' \
              -e KAKAO_CLIENT_ID='${{ secrets.KAKAO_CLIENT_ID }}' \
              -e KAKAO_CLIENT_SECRET='${{ secrets.KAKAO_CLIENT_SECRET }}' \
              -e NAVER_CLIENT_ID='${{ secrets.NAVER_CLIENT_ID }}' \
              -e NAVER_CLIENT_SECRET='${{ secrets.NAVER_CLIENT_SECRET }}' \
              -e FCM_PROJECT_ID='${{ secrets.FCM_PROJECT_ID }}' \
              -e FCM_KEY_PATH='file:/app/firebase-key.json' \
              -e SPRINGDOC_API_DOCS_ENABLED=true \
              -e SPRINGDOC_SWAGGER_UI_ENABLED=true \
              "${IMAGE}"

            for i in $(seq 1 30); do
              if curl --max-time 3 -sf "${{ env.HEALTH_URL }}" > /dev/null; then
                echo "OK: health endpoint is responding"
                break
              fi
              echo "waiting... ($i)"
              sleep 2
            done

            curl --max-time 5 -sf "${{ env.HEALTH_URL }}" > /dev/null

            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

            echo "=== check openapi ==="
            curl --max-time 8 -fsS -D - -o /dev/null http://127.0.0.1:8080/v3/api-docs | sed -n '1,10p'

            echo "=== check swagger-ui index ==="
            curl --max-time 8 -fsS -D - -o /dev/null http://127.0.0.1:8080/swagger-ui/index.html | sed -n '1,10p'
            echo "=== deploy end: $(date) ==="
