name: CI/CD Pipeline

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build -x test

      # ===============================
      # AWS Credentials (공백/줄바꿈 방어)
      # ===============================
      - name: Normalize AWS secrets
        id: aws-secrets
        run: |
          echo "AWS_ACCESS_KEY_ID=$(printf '%s' '${{ secrets.AWS_ACCESS_KEY_ID }}' | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$(printf '%s' '${{ secrets.AWS_SECRET_ACCESS_KEY }}' | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "AWS_REGION=$(printf '%s' '${{ secrets.AWS_REGION }}' | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "ECR_REGISTRY=$(printf '%s' '${{ secrets.ECR_REGISTRY }}' | tr -d '[:space:]')" >> $GITHUB_ENV
          echo "ECR_REPOSITORY=$(printf '%s' '${{ secrets.ECR_REPOSITORY }}' | tr -d '[:space:]')" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2 instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            AWS_REGION="$(printf '%s' '${{ secrets.AWS_REGION }}' | tr -d '[:space:]')"
            ECR_REGISTRY="$(printf '%s' '${{ secrets.ECR_REGISTRY }}' | tr -d '[:space:]')"
            ECR_REPOSITORY="$(printf '%s' '${{ secrets.ECR_REPOSITORY }}' | tr -d '[:space:]')"
            IMAGE_TAG="${{ github.sha }}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            docker pull "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            docker rm -f travodo-app || true

            docker run -d --name travodo-app \
              --restart unless-stopped \
              -p 8080:8080 \
              --env-file /opt/tripleS/.env \
              "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
