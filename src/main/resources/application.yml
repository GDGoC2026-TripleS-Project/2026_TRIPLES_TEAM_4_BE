server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:unimate_db}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONN_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    properties:
      hibernate:
        format_sql: false
    show-sql: false
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Seoul

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 500MB
      file-size-threshold: 2KB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:seokhawnkim@gmail.com}
    password: ${MAIL_PASSWORD:lhpzobtkpfvnstvd}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    url: /v3/api-docs
    display-request-duration: true
    groups-order: ASC

jwt:
  secret: ${JWT_SECRET:unimate-local-jwt-secret-key-32bytes!!}
  expiration: ${JWT_EXPIRATION:3600000}

aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    bucket-name: ${AWS_S3_BUCKET_NAME:}
    base-url: ${AWS_S3_BASE_URL:}
    region: ${AWS_S3_REGION:ap-northeast-2}

app:
  swagger:
    prod-url: ${SWAGGER_PROD_URL:http://localhost:8080}
  dev-token:
    enabled: ${DEV_TOKEN_ENABLED:false}
  frontend:
    url: ${FRONTEND_URL:}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:f0090451b3aedc13683fc670394f8de8}
    client-secret: ${KAKAO_CLIENT_SECRET:R9E7xGESxXIk9Q8HVfh2nu8adIUsOpaA}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token

  naver:
    client-id: ${NAVER_CLIENT_ID:Ze3_z_ELhRaAGd_SNrhm}
    client-secret: ${NAVER_CLIENT_SECRET:QoMkLUvbur}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/api/auth/naver/callback}
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me

  

