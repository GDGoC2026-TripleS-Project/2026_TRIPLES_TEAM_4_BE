spring:
  datasource:
    # 운영은 DB_HOST/PORT/NAME로도 되고, SPRING_DATASOURCE_URL로도 됨.
    # 지금 너는 .env에 SPRING_DATASOURCE_URL을 넣었으니 그걸 우선으로 쓰게 두는 게 깔끔.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  swagger:
    prod-url: http://unimate-alb-274308250.ap-northeast-2.elb.amazonaws.com

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: http://unimate-alb-274308250.ap-northeast-2.elb.amazonaws.com/api/auth/kakao/callback

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: http://unimate-alb-274308250.ap-northeast-2.elb.amazonaws.com/api/auth/naver/callback

fcm:
  project-id: ${FCM_PROJECT_ID:unimate-1d1d1}
  key-path: ${FCM_KEY_PATH:/app/firebase-key.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

  health:
    mail:
      enabled: false

aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket-name: ${AWS_S3_BUCKET:seok-hwan-bucket}
    base-url: ${AWS_S3_BASE_URL:https://seok-hwan-bucket.s3.ap-northeast-2.amazonaws.com}

