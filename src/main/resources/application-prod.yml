spring:
  datasource:
    # 운영은 DB_HOST/PORT/NAME로도 되고, SPRING_DATASOURCE_URL로도 됨.
    # 지금 너는 .env에 SPRING_DATASOURCE_URL을 넣었으니 그걸 우선으로 쓰게 두는 게 깔끔.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  swagger:
    prod-url: https://seok-hwan1.duckdns.org

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: https://seok-hwan1.duckdns.org/api/auth/kakao/callback

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: https://seok-hwan1.duckdns.org/api/auth/naver/callback

fcm:
  project-id: ${FCM_PROJECT_ID:unimate-1d1d1}
  key-path: ${FCM_KEY_PATH:/app/firebase-key.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

  # ✅ 핵심: 운영에서 메일 헬스체크로 readiness DOWN 되는 거 방지
  health:
    mail:
      enabled: false
