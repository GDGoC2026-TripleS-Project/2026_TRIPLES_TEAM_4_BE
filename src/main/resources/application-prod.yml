spring:
  datasource:
    # 운영은 무조건 ENV로 덮어쓰기 권장
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  swagger:
    prod-url: ${SWAGGER_PROD_URL:https://seok-hwan1.duckdns.org}
  frontend:
    url: ${FRONTEND_URL:https://seok-hwan1.duckdns.org}

oauth:
  kakao:
    redirect-uri: ${KAKAO_REDIRECT_URI:https://seok-hwan1.duckdns.org/api/auth/kakao/callback}

  naver:
    redirect-uri: ${NAVER_REDIRECT_URI:https://seok-hwan1.duckdns.org/api/auth/naver/callback}

fcm:
  project-id: ${FCM_PROJECT_ID:unimate-1d1d1}
  # 운영은 마운트된 절대경로를 ENV로 주입하는 방식이 가장 안정적
  key-path: ${FCM_KEY_PATH:/app/firebase-key.json}
